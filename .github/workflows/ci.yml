name: CI

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One group per ref: a superseded run on the SAME ref is cancelled, master
  # deploys never are (an interrupted Pages deploy is not resumable). The
  # workflow has no pull_request trigger (dispatch + master push only), so
  # there is no PR-cancellation half to configure.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # GitHub-hosted: the hub wears the hikari webui shell, which is rendered
    # at build time through a Node SSR pass over the lagrange webui bundle —
    # that needs lagrange's SOURCES (the bundle is not an npm package), its
    # webui build, and Node. Pinned to the released tag: floating master made
    # every engine regression land on the live hub before it was reviewed,
    # and the release line is what the project sites install from crates.io.
    # This is the same closed loop lagrange's own docs site ships with. Runs
    # on master pushes and manual dispatch only (no PR-time runs since the
    # 2026-11-06 trigger-policy rework).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: celestia-island/lagrange
          ref: v0.3.31
          path: lagrange

      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: pnpm --dir lagrange/packages/webui install --no-frozen-lockfile
      - run: pnpm --dir lagrange/packages/webui build:docs:all
      - name: Build docs through the hikari webui lane
        run: >
          cd lagrange
          && LAGRANGE_SKIP_LIVE=1 cargo run --release -- build
          --src "$GITHUB_WORKSPACE/docs" --out "$GITHUB_WORKSPACE/_site"

      - name: Set CNAME
        run: echo "docs.celestia.world" > _site/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  lint:
    # Markdown lint is sub-minute and stdlib-only, and this is a public
    # repository (AGENTS §8.2 allows hosted jobs here) — keeping it hosted
    # leaves the farm free for the build lane. Same rationale as
    # rules-lint.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown
        run: markdownlint 'docs/**/*.md' --config .markdownlint.json
