[site]
title = "Celestia World Docs"
description = "Documentation hub for the celestia-island ecosystem — philosophy, ecosystem map, and getting started."
# 构建期输入（徽标唯一家 = celestia-island.github.io res/logos/celestia.webp 的副本；
# favicon.svg 同为构建输入）。lagrange 也会在未配置时自动探测这些文件名。
logo = "logo.webp"
favicon = "favicon.svg"

cname = "docs.celestia.world"

[layout]
content_padding = "max(16px, 10%)"

[languages]
default = "en"
order = ["en", "zh-Hans", "zh-Hant", "ja", "ko", "de", "fr", "es", "pt", "ru", "ar"]
