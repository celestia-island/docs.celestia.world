name: CI

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # Self-hosted farm: this is the hub's only publishing lane, and the
    # GitHub-hosted tier has been unavailable org-wide since 2026-09-24
    # (`_ledger/ci-state.md`), which left content changes undeployable while
    # the sibling docs site had already moved to the farm for exactly this
    # reason. Fork PRs stay off the shared runners — an outside tree is not
    # executed here; the build only needs to gate first-party PRs and master.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 120
    env:
      # The org runners rewrite github.com/celestia-island/* to local bare
      # mirrors. This repository has no mirror, and the lagrange fallback below
      # installs from git, so talk to github.com directly (same reason the
      # sibling docs site sets this).
      GIT_CONFIG_COUNT: "0"
    steps:
      - uses: actions/checkout@v7

      # lagrange is preinstalled at /mnt/work/runner-shared/lagrange (refreshed
      # from git master when lagrange changes); the version is printed so a
      # stale build is visible in the log. Fall back to a local cargo install
      # when the shared binary is missing.
      - name: Install lagrange
        run: |
          set -euo pipefail
          if [ -x /mnt/work/runner-shared/lagrange/bin/lagrange ]; then
            /mnt/work/runner-shared/lagrange/bin/lagrange --version
            echo "/mnt/work/runner-shared/lagrange/bin" >> "$GITHUB_PATH"
          else
            cargo install lagrange-library --locked \
              || cargo install --git https://github.com/celestia-island/lagrange --branch master lagrange-library
          fi

      - name: Build docs
        run: lagrange build --src docs --out _site

      - name: Set CNAME
        run: echo "docs.celestia.world" > _site/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  lint:
    # Markdown lint is sub-minute and stdlib-only, and this is a public
    # repository (AGENTS §8.2 allows hosted jobs here) — keeping it hosted
    # leaves the farm free for the build lane. Same rationale as
    # rules-lint.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown
        run: markdownlint 'docs/**/*.md' --config .markdownlint.json
